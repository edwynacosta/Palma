<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PALMA - Facturación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'palma-green': '#008f39',
            'palma-red': '#dd6b6b',
            'palma-bg': '#f3f4f6',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="caja_estilos.css">
</head>
<body class="bg-palma-bg min-h-screen p-4 font-['Open_Sans']">

  <div class="max-w-[1200px] mx-auto flex flex-col gap-4">
    
    <div class="flex justify-between items-center gap-3 w-full mb-4">
  <div class="flex gap-2 flex-1">
    <button class="tab-button">CAJA</button>
    <button class="tab-button">FACTURA<br>ELECTRÓNICA</button>
    <button class="tab-button">DEVOLUCIONES</button>
    <button class="tab-button">RECIBO<br>PROVEEDORES</button>
  </div>
  <button class="btn-close text-xl font-black">X</button>
</div>

    <div class="grid grid-cols-12 gap-6">
      
      <div class="col-span-12 lg:col-span-3 flex flex-col gap-4">
        <div class="bg-palma-green text-white p-6 rounded-[20px] shadow-md">
          <p class="text-sm font-bold mb-4">Total a pagar:</p>
          <p class="text-4xl font-extrabold text-center">$123.000</p>
        </div>

        <div class="bg-white text-palma-green p-6 rounded-[20px] shadow-md border">
          <p class="text-sm font-bold mb-4 text-green-800">Efectivo</p>
          <p class="text-4xl font-extrabold text-center">$150.000</p>
        </div>

        <div class="bg-palma-red text-white p-6 rounded-[20px] shadow-md">
          <p class="text-sm font-bold mb-4">Cambio</p>
          <p class="text-4xl font-extrabold text-center">$27.000</p>
        </div>
      </div>

      <div class="col-span-12 lg:col-span-9 flex flex-col gap-4">
        <div class="bg-white rounded-[25px] shadow-sm border p-8 flex-1 min-h-[500px] relative">
          <h2 class="text-palma-green text-2xl font-black text-center mb-8 tracking-wider">FACTURACIÓN</h2>
          
          <div class="grid grid-cols-4 text-palma-green font-bold text-xs text-center border-b pb-4">
            <span>ID</span>
            <span>NOMBRE</span>
            <span>CANTIDAD/ PESO</span>
            <span>PRECIO</span>
          </div>

          <div class="flex-1 mt-4">
            </div>
        </div>

        <div class="grid grid-cols-5 gap-3">
          <button class="btn-action bg-palma-green text-white col-span-1">COBRAR</button>
          <button class="btn-action bg-white text-palma-green border">AGREGAR</button>
          <button class="btn-action bg-white text-palma-green border">ELIMINAR</button>
          <button class="btn-action bg-white text-palma-green border">MODIFICAR</button>
          <button class="btn-action bg-white text-palma-green border">BUSCAR</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
